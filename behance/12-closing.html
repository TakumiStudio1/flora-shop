<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1920px;height:1080px;background:#FDFCF9;font-family:'Helvetica Neue',Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.bg-shape{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.3;}
.bg-shape:nth-child(1){width:600px;height:600px;background:rgba(74,124,89,0.12);top:-150px;right:-100px;}
.bg-shape:nth-child(2){width:400px;height:400px;background:rgba(196,114,90,0.08);bottom:-100px;left:-50px;}
.leaf-bg{position:absolute;border-radius:50% 0 50% 0;background:#4A7C59;opacity:0.04;}
.leaf-bg:nth-child(3){width:250px;height:160px;top:80px;left:120px;transform:rotate(-30deg);}
.leaf-bg:nth-child(4){width:200px;height:130px;bottom:100px;right:150px;transform:rotate(25deg);}
.content{text-align:center;position:relative;z-index:1;}
.logo{font-family:Georgia,serif;font-size:80px;font-weight:400;letter-spacing:12px;color:#4A7C59;margin-bottom:30px;}
.tagline{font-size:26px;font-weight:300;color:rgba(26,46,26,0.4);letter-spacing:0.5px;margin-bottom:50px;}
.divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,rgba(74,124,89,0.3),transparent);margin:0 auto 50px;}
.credits{display:flex;flex-direction:column;gap:8px;margin-bottom:50px;}
.credit-line{font-size:13px;color:rgba(26,46,26,0.3);letter-spacing:1px;}
.credit-line strong{color:rgba(26,46,26,0.55);font-weight:500;}
.links{display:flex;gap:20px;justify-content:center;margin-bottom:40px;}
.link{padding:10px 28px;border:1px solid rgba(26,46,26,0.08);border-radius:50px;font-size:12px;color:rgba(26,46,26,0.4);letter-spacing:0.5px;}
.link-green{border-color:rgba(74,124,89,0.3);color:#4A7C59;}
.year{font-size:11px;letter-spacing:3px;color:rgba(26,46,26,0.15);text-transform:uppercase;}
.corner-tl{position:absolute;top:50px;left:60px;}
.corner-br{position:absolute;bottom:50px;right:60px;}
.corner-line{width:40px;height:1px;background:rgba(74,124,89,0.15);margin-bottom:6px;}
.corner-text{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(26,46,26,0.15);}
</style>
</head>
<body>
<div class="bg-shape"></div>
<div class="bg-shape"></div>
<div class="leaf-bg"></div>
<div class="leaf-bg"></div>
<div class="corner-tl"><div class="corner-line"></div><div class="corner-text">Portfolio piece #4</div></div>
<div class="corner-br"><div class="corner-line"></div><div class="corner-text">E-Commerce &bull; Brand Identity</div></div>
<div class="content">
  <div class="logo">FLŌRA</div>
  <div class="tagline">Premium plants, beautifully delivered.</div>
  <div class="divider"></div>
  <div class="credits">
    <div class="credit-line"><strong>Design &amp; Development</strong> &mdash; Fatima Munoz</div>
    <div class="credit-line"><strong>Stack</strong> &mdash; HTML5, CSS3, Vanilla JavaScript</div>
    <div class="credit-line"><strong>Features</strong> &mdash; Light theme, CSS plants, Scroll animations, Product filters</div>
  </div>
  <div class="links">
    <span class="link link-green">View live site</span>
    <span class="link">GitHub repo</span>
  </div>
  <div class="year">2026</div>
</div>
</body>
</html>
